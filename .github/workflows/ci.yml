name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [contentful-publish]
  # Schedule cron trigger disabled per assignment requirements after successful verification to save free minutes:
  # schedule:
  #   - cron: "0 0 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate PR Diff & Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git diff origin/main...HEAD > pr_diff.txt || true
          node scripts/ai-review.mjs
      - name: Post Gemini Review Comment on PR
        if: hashFiles('review.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('review.md')) {
              const review = fs.readFileSync('review.md', 'utf8');
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: review,
              });
            }

  build:
    needs: [lint, format, test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN || vars.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    needs: [lint, format, test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN || vars.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_SHA: ${{ github.event.pull_request.head.sha }}
      - id: alias
        run: echo "name=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
      - id: upload
        shell: bash
        run: |
          npx wrangler versions upload \
            --preview-alias "${{ steps.alias.outputs.name }}" \
            --message "PR #${{ github.event.number }} ${{ github.event.pull_request.head.sha }}" \
            | tee upload.log
          URL=$(grep -o 'Version Preview Alias URL: .*' upload.log 2>/dev/null | cut -d' ' -f5 || true)
          if [ -z "$URL" ]; then
            URL=$(grep -i -o 'https://[^ ]*workers\.dev' upload.log 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ steps.alias.outputs.name }}-tdw-mp1.carlosteixeira05.workers.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Preview: ${{ steps.upload.outputs.url }}",
            });

  lighthouse:
    needs: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for preview URL to be reachable
        shell: bash
        run: |
          echo "Checking reachability of ${{ needs.preview.outputs.url }}..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.preview.outputs.url }}" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Preview URL returned HTTP 200!"
              break
            fi
            echo "Attempt $i: status $STATUS, waiting 5 seconds..."
            sleep 5
          done
      - name: Audit Preview with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ needs.preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
